<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FNAF Launcher</title>
    
    <!-- PWA Essentials -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6600">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/freddy-512.png">

    <style>
        body { margin:0; padding:0; background:#000; color:#ffcc00; font-family:'Courier New',monospace; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
        .title { font-size:3rem; text-shadow:0 0 20px #ff0000; margin-bottom:2rem; }
        .btn { background:linear-gradient(45deg,#ff6600,#cc0000); color:white; border:none; padding:1rem 2rem; font-size:1.5rem; border-radius:10px; margin:1rem; cursor:pointer; box-shadow:0 0 20px #ff0000; }
        .games { display:none; flex-direction:column; gap:1rem; padding:1rem; width:90%; max-width:400px; }
        .game-btn { background:#ff0000; color:white; padding:0.8rem; border:none; border-radius:8px; font-size:1.2rem; cursor:pointer; }
    </style>
</head>
<body>
    <div id="menu">
        <div class="title">FNAF LAUNCHER</div>
        <button class="btn" onclick="document.getElementById('menu').style.display='none'; document.getElementById('games').style.display='flex';">PLAY</button>
    </div>

    <div id="games" class="games">
        <button class="game-btn" onclick="window.open('https://www.gameflare.com/online-game/five-nights-at-freddys', '_blank')">FNAF 1</button>
        <button class="game-btn" onclick="window.open('https://example.com/fnaf2', '_blank')">FNAF 2 (troque o link)</button>
        <!-- Adicione mais jogos aqui -->
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW erro:', err));
        }
    </script>
</body>
</html>
